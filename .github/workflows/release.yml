name: Build and Release Poke5 TWRP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag, for example v4.0-20261022-1 (reusing an existing tag updates that release)"
        required: true
      release_name:
        description: "Release title"
        required: true
        default: "TWRP 3.7.0 for Poke5 — v4.0 (2025-04-02)"
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        type: boolean
        default: true
      make_latest:
        description: "Mark as latest release (only enable for a final release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: twrp-poke5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package TWRP 11
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ALLOW_MISSING_DEPENDENCIES: "true"
      LC_ALL: C
      LANG: C
      BUILD_JOBS: "4"
      USE_CCACHE: "1"
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_COMPILERCHECK: content
      RELEASE_TAG: ${{ inputs.tag }}
      ASSET_STEM: twrp-Poke5-3.7.0-${{ inputs.tag }}

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: device/onyx/Poke5
          fetch-depth: 1

      - name: Validate release tag
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" || "${RELEASE_TAG}" != v* ]]; then
            echo "tag must be non-empty and start with v" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" == */* ]]; then
            echo "tag must not contain /" >&2
            exit 1
          fi
          echo "Release tag: ${RELEASE_TAG}"
          echo "Asset stem: ${ASSET_STEM}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ccache cpio curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libssl-dev libxml2-utils lzop \
            openjdk-11-jdk python3 python3-venv repo rsync schedtool \
            squashfs-tools unzip xz-utils xsltproc zip zlib1g-dev

      - name: Show runner storage
        run: df -h

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ runner.os }}-ccache-twrp11-poke5-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-twrp11-poke5-

      - name: Configure compiler cache
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache --max-size=4G
          ccache --zero-stats

      - name: Initialize TWRP 11 source
        run: |
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-11
          repo sync -c --no-clone-bundle --no-tags --fail-fast -j"${BUILD_JOBS}"

      - name: Apply Poke5 TWRP patches
        run: bash device/onyx/Poke5/apply-patches.sh

      - name: Build recovery image
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          source build/envsetup.sh
          lunch twrp_Poke5-eng
          mka -j"${BUILD_JOBS}" recoveryimage

      - name: Verify recovery image
        run: |
          set -euo pipefail
          IMAGE="out/target/product/Poke5/recovery.img"
          UNPACKED="${RUNNER_TEMP}/poke5-unpacked"
          RAMDISK_CPIO="${RUNNER_TEMP}/poke5-ramdisk.cpio"
          MAGISKBOOT="external/magisk-prebuilt/prebuilt/magiskboot_x86"

          test -s "${IMAGE}"
          test "$(stat -c %s "${IMAGE}")" -le 100663296
          mkdir -p "${UNPACKED}"

          python3 system/tools/mkbootimg/unpack_bootimg.py \
            --boot_img "${IMAGE}" --out "${UNPACKED}" >/dev/null

          echo "3c45b89edfebc063f2514540fd17e165f0967b9ce5fddbf60c3cd76940bba457  ${UNPACKED}/kernel" | sha256sum -c -
          echo "9abe41f347215f6fb13ae0bd84f6bf5fe12bfd4bdb434e9244ceeae3a8b00a14  ${UNPACKED}/recovery_dtbo" | sha256sum -c -
          echo "093e513e99fe888e4dadd6456a8d316c4d984a6c69447cfff346403f3dd47c03  ${UNPACKED}/dtb" | sha256sum -c -

          "${MAGISKBOOT}" decompress "${UNPACKED}/ramdisk" "${RAMDISK_CPIO}"
          "${MAGISKBOOT}" cpio "${RAMDISK_CPIO}" \
            "exists init.recovery.qcom.rc" \
            "exists twres/ui.xml" \
            "exists twres/portrait.xml" \
            "exists twres/splash.xml" \
            "exists twres/fonts/RobotoCondensed-Regular.ttf" \
            "exists twres/fonts/DroidSansMono.ttf" \
            "exists waveform/eink_waveform.wbf" \
            "exists system/bin/recovery" \
            "exists system/lib64/libminuitwrp.so"

      - name: Package 96 MiB recovery image
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/poke5-release"
          RAW="${RUNNER_TEMP}/poke5-raw"
          mkdir -p "${STAGE}" "${RAW}"
          python3 device/onyx/Poke5/tools/package_poke5.py \
            --tree . \
            --template device/onyx/Poke5/tools/stock-avb-template.bin \
            --output "${STAGE}/${ASSET_STEM}.img" \
            --raw-dir "${RAW}"
          cat "${STAGE}/${ASSET_STEM}.img.sha256"

      - name: Upload packaged image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_STEM }}
          path: ${{ runner.temp }}/poke5-release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ASSET_STEM: twrp-Poke5-3.7.0-${{ inputs.tag }}

    steps:
      - name: Download packaged image
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ASSET_STEM }}
          path: ${{ runner.temp }}/poke5-release

      - name: Verify downloaded artifact
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/poke5-release"
          test "$(stat -c %s "${STAGE}/${ASSET_STEM}.img")" -eq 100663296
          (cd "${STAGE}" && sha256sum -c "${ASSET_STEM}.img.sha256")

      - name: Generate release body
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/poke5-release"
          SHA=$(cut -d' ' -f1 "${STAGE}/${ASSET_STEM}.img.sha256")
          cat > "${STAGE}/release-body.md" <<'EOF'
          # TWRP 3.7.0 for ONYX BOOX Poke5 (v4.0)

          基于 Poke5 原厂 v4.0（2025-04-02）recovery 重构的 TWRP 3.7.0。

          - 机型：ONYX BOOX Poke5（Qualcomm QCM2290 / bengal）
          - 系统：Android 11（SDK 30）
          - 内核：原厂 Linux 4.19.157-perf #9（2025-02-25，Image.gz）
          - DTB / recovery_dtbo：与原厂 v4.0 逐字节一致
          - boot header：base 0x0，kernel 0x8000，ramdisk 0x1000000，tags 0x100，dtb 0x1f00000
          - 安全补丁：2024-02-01
          - 镜像：96 MiB 整分区（100,663,296 bytes），带原厂同款 hash-only AVB footer（无签名）

          SHA256:
          ```
          __SHA__  __ASSET__.img
          ```

          刷入（需解锁 bootloader）：
          ```sh
          adb shell getprop ro.boot.slot_suffix
          fastboot flash recovery_a __ASSET__.img
          fastboot reboot recovery
          ```

          不要刷到 boot_a/boot_b；96 MiB 文件请完整写入，不要截断。源码提交 __COMMIT__。

          注意：该构建尚未在 Poke5 上实测，显示/前光/data 解密需要首次启动验证。
          EOF
          sed -i "s/__SHA__/${SHA}/g; s/__ASSET__/${ASSET_STEM}/g; s/__COMMIT__/${GITHUB_SHA}/g" "${STAGE}/release-body.md"
          cat "${STAGE}/release-body.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ inputs.release_name }}
          body_path: ${{ runner.temp }}/poke5-release/release-body.md
          files: |
            ${{ runner.temp }}/poke5-release/${{ env.ASSET_STEM }}.img
            ${{ runner.temp }}/poke5-release/${{ env.ASSET_STEM }}.img.sha256
            ${{ runner.temp }}/poke5-release/${{ env.ASSET_STEM }}.info.txt
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
